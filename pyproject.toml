[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tavr-decide"
version = "0.1.0"
description = "Decision layer for TAVR planning and staged deployment: reversibility grammar, uncertainty-aware proxies, action-stability probability, margin certificates and value-of-computation gated model activation."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "TAVR-Decide contributors"}]
keywords = ["TAVR", "TAVI", "digital twin", "decision analysis", "value of information", "multifidelity"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = ["numpy>=1.24", "scipy>=1.10", "scikit-image>=0.21", "nibabel>=5"]

[project.optional-dependencies]
dev = ["pytest>=7"]
dicom = ["SimpleITK>=2.3", "pydicom>=2.4"]
segmentation = ["totalsegmentator>=2.4"]

[project.scripts]
tavr-decide = "tavr_decide.cli:main"

[tool.setuptools.packages.find]
include = ["tavr_decide*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
